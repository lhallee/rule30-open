[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rule30-open"
version = "0.1.0"
description = "Computations behind the findings and negative results of an open effort on the Rule 30 Prize problems"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.5.3", "pyyaml>=6.0.3", "scipy>=1.18.1", "tqdm>=4.70.1"]

[project.optional-dependencies]
test = ["pytest>=9.1.1"]
# computations.persistence and computations.projections: persistent homology and learned projections.
topology = ["ripser>=0.6", "scikit-learn>=1.5"]
# computations.late_onset.sat_longest: the SAT form of the late-onset search.
sat = ["python-sat>=1.8"]

[tool.setuptools]
packages = ["computations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Plugins of the global environment that no test uses and whose import (torch, zarr, dash) costs about 20 s per run.
addopts = "-p no:anyio -p no:dash -p no:hydra_pytest -p no:hypothesispytest -p no:jaxtyping -p no:pytest_cov -p no:torchtyping -p no:typeguard -p no:zarr"
