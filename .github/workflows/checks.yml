name: checks

on:
  push:
  pull_request:

# Runs of one branch or pull request queue behind each other; a newer push to a pull request cancels the run still
# going for the older one. The Lean job keeps GitHub's limit of six hours: some modules take ten minutes each to build.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean:
    name: Lean proofs and axioms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyyaml>=6.0.3"
      - run: python scripts/catalog.py audit

  # The tests run on the contributor's machine, in under a minute: `python -m pytest`.
  python:
    name: Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyyaml>=6.0.3"
      - run: python scripts/catalog.py check
